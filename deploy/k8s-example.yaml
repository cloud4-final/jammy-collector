apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobility-collector
  labels:
    app: mobility-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mobility-collector
  template:
    metadata:
      labels:
        app: mobility-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: collector
          image: ghcr.io/cloud4-final/hybrid-5th/mobility-collector:sha-REPLACE_ME # main merge 후 생성된 sha-<short> 태그로 교체
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SITE_ID
              value: "jammy-a" # placeholder: jammy-a | jammy-b | jammy-c
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: collector-db
                  key: DATABASE_URL
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: collector-db
                  key: DATABASE_READ_URL
            - name: DB_POOL_MIN
              value: "1"
            - name: DB_POOL_MAX
              value: "10"
            - name: DEPLOY_ENV
              value: "prod"
            - name: OTEL_SERVICE_NAME
              value: "mobility-collector"
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://<HOST_ALLOY_IP>:4318" # Host Alloy 주소 (합의 후 개방 시 활성화)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mobility-collector
  labels:
    app: mobility-collector
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: mobility-collector
